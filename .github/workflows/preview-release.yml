name: Preview Release

on:
  push:
    branches:
      - preview

jobs:
  preview:
    name: Preview Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Preview Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bun run release
          echo "Preview release completed"
